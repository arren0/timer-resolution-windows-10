name: build-timerfix
 
on:
  workflow_dispatch:
  push:
    paths:
      - 'timerfix.cpp'
 
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Build with MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          cl /O2 /EHsc timerfix.cpp /link /SUBSYSTEM:WINDOWS shell32.lib user32.lib gdi32.lib /OUT:TimerFix.exe
 
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: TimerFix
          path: TimerFix.exe
